name: android-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  # Superseded runs for the same PR (or branch) are cancelled, not queued.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # A commit that lands on main through a PR was already built by that PR's
    # run, so only direct pushes (or pushes whose PR lookup fails) need a
    # fresh build.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    outputs:
      run_build: ${{ steps.check.outputs.run_build }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fail open: if the lookup itself breaks, run the build as before.
          if ! pr_count=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq 'length' 2>/dev/null); then
            echo "::warning::Could not look up pull requests for ${GITHUB_SHA}; running the build."
            pr_count=0
          fi
          echo "PRs associated with ${GITHUB_SHA}: ${pr_count:-0}"
          if [ "${pr_count:-0}" -eq 0 ]; then
            echo "run_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gate
    # gate is skipped on pull_request; !cancelled() keeps the build running.
    if: ${{ !cancelled() && needs.gate.outputs.run_build != 'false' }}
    # ubuntu-latest starts migrating to 26.04 in Oct 2026; pin the validated
    # image until the Android toolchain is checked on the new one.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # The accompanist lyrics artifacts ship Java 21 bytecode (class
          # file major 65); loading them on any older test JVM throws
          # UnsupportedClassVersionError.
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew :rui:allTests :rui-icons:allTests :sample:androidApp:assembleDebug
