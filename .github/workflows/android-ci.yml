name: android-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # The accompanist lyrics artifacts ship Java 21 bytecode (class
          # file major 65); loading them on any older test JVM throws
          # UnsupportedClassVersionError.
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew :rui:allTests :rui-icons:allTests :sample:androidApp:assembleDebug
