name: android-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # ubuntu-latest starts migrating to 26.04 in Oct 2026; pin the validated
    # image until the Android toolchain is checked on the new one.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # The accompanist lyrics artifacts ship Java 21 bytecode (class
          # file major 65); loading them on any older test JVM throws
          # UnsupportedClassVersionError.
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew :rui:allTests :rui-icons:allTests :sample:androidApp:assembleDebug
