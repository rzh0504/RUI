name: ios-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Same dependency-bytecode story as android-ci: the test JVMs and
          # the Kotlin toolchain must be able to load Java 21 class files.
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile Kotlin for iOS
        run: |
          chmod +x gradlew
          ./gradlew :rui-ui:compileKotlinIosSimulatorArm64 :sample:shared:compileKotlinIosSimulatorArm64

      - name: Select the latest Xcode on the runner
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selecting $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version

      - name: Build iOS app (includes framework link + embed)
        run: |
          # -target builds reject -derivedDataPath (a scheme-only flag); put
          # the products in a known place via CONFIGURATION_BUILD_DIR. ARCHS
          # pins the simulator to arm64 — the KMP framework targets only
          # register iosSimulatorArm64, and the run-script Gradle call fails
          # on the x86_64 slice Xcode would otherwise include. The app is
          # built but not launched: CI validates the build, not the UI.
          xcodebuild \
            -project sample/iosApp/iosApp.xcodeproj \
            -target iosApp \
            -sdk iphonesimulator \
            -configuration Debug \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CONFIGURATION_BUILD_DIR="$PWD/sample/iosApp/build/Products" \
            build \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload iOS app
        uses: actions/upload-artifact@v4
        # Artifact-only delivery: the simulator .app is uploaded for
        # download and manual install on a simulator. Nothing is ever
        # published to a GitHub release.
        with:
          name: iosApp-simulator-debug
          path: sample/iosApp/build/Products/*.app
